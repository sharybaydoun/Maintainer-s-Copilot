services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CHAT_MEMORY_TTL_SECONDS: "3600"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      MINIO_UPLOAD_REPORTS: "true"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_SECRET_PATH: copilot
      VAULT_KV_MOUNT: secret
      VAULT_REQUIRED: "false"
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      CORS_ORIGINS: http://localhost:8501,http://localhost:5173,http://localhost:8080,http://chatbot:8501,http://widget,http://host
      OTEL_SERVICE_NAME: maintainers-copilot-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Phase 4: where the React widget iframe is served from (used by /widget.js)
      WIDGET_BASE_URL: http://localhost:${WIDGET_PORT:-5173}
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      # Unauthenticated readiness probe — works even when AUTH_REQUIRED=true.
      # /admin/health/full requires admin JWT in that mode; healthchecks
      # must not need credentials.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  chatbot:
    build:
      context: .
      dockerfile: chatbot/Dockerfile
    restart: unless-stopped
    ports:
      - "${CHATBOT_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      CHATBOT_USER: ${CHATBOT_USER:-admin}
      CHATBOT_PASSWORD: ${CHATBOT_PASSWORD:-copilot}
    depends_on:
      api:
        condition: service_healthy
    # Explicit compose-level probe so `docker compose ps` shows green/healthy.
    # Mirrors the HEALTHCHECK in chatbot/Dockerfile.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  widget:
    build:
      context: widget
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${WIDGET_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  host:
    build:
      context: host
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:${API_PORT:-8000}
        WIDGET_ID: ${DEMO_WIDGET_ID:-00000000-0000-0000-0000-000000000000}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      - widget
      - api

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  jaeger:
    # Jaeger all-in-one with native OTLP receiver (port 4318 HTTP).
    # UI: http://localhost:${JAEGER_UI_PORT:-16686}
    image: jaegertracing/all-in-one:1.57
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  vault:
    image: hashicorp/vault:1.18
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  minio_data:
